name: Release and PyPI Publish

# A reviewed pull request prepares one complete release candidate on main. The
# dispatch job can create only the matching vX.Y.Z tag through the release App.
# Publication then runs from that immutable tag in the protected pypi
# environment. An exact-tag rerun is the only recovery path.
# The release is an unadmitted release candidate. Only production-channel.yml
# can cache an active central OpenAdaptAI/.github admission.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Reviewed main version to tag and publish (X.Y.Z)"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  RELEASE_DISPATCH_ACTOR_ID: "774615"
  RELEASE_APP_ID: "4730708"
  RELEASE_APP_ACTOR_ID: "321543906"
  RELEASE_APP_INSTALLATION_ID: "156835568"

concurrency:
  group: engine-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authorize-release-dispatch:
    name: Refuse an invalid engine release dispatch
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    permissions: {}
    steps:
      - name: Require the exact repository, main ref, and stable version input
        env:
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ] || \
             [ "${EVENT_ACTOR_ID}" != "${RELEASE_DISPATCH_ACTOR_ID}" ] || \
             [ "${GITHUB_REPOSITORY}" != "OpenAdaptAI/openadapt-desktop" ] || \
             [ "${GITHUB_REF}" != "refs/heads/main" ] || \
             [ "${GITHUB_REF_TYPE}" != "branch" ] || \
             ! printf '%s' "${REQUESTED_VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "error: release dispatch requires OpenAdaptAI/openadapt-desktop main and X.Y.Z" >&2
            exit 1
          fi

  create-release-tag:
    name: Create the reviewed engine release tag
    needs: authorize-release-dispatch
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      needs.authorize-release-dispatch.result == 'success'
    runs-on: ubuntu-22.04
    environment: release-identity
    permissions:
      actions: read
      contents: read
    outputs:
      engine_tag: ${{ steps.candidate.outputs.engine_tag }}
      engine_commit: ${{ steps.candidate.outputs.engine_commit }}
    steps:
      - name: Checkout the dispatched main candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Require the exact reviewed candidate and release evidence
        id: candidate
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ] || \
             [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "error: engine tag creation requires a main workflow_dispatch" >&2
            exit 1
          fi
          if [ "${GITHUB_REPOSITORY}" != "OpenAdaptAI/openadapt-desktop" ]; then
            echo "error: engine tag creation requires OpenAdaptAI/openadapt-desktop" >&2
            exit 1
          fi
          if ! printf '%s' "${REQUESTED_VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "error: requested version must be an exact stable X.Y.Z version" >&2
            exit 1
          fi
          git fetch --force origin main:refs/remotes/origin/main --tags
          current_main="$(git rev-parse --verify refs/remotes/origin/main)"
          if [ "${GITHUB_SHA}" != "${current_main}" ]; then
            echo "error: dispatched ${GITHUB_SHA} is not current main ${current_main}" >&2
            exit 1
          fi
          python scripts/check_release_consistency.py
          python scripts/verify_release_lock.py
          engine_version="$(python - <<'PY'
          from scripts.check_release_consistency import release_versions
          values = set(release_versions().values())
          if len(values) != 1:
              raise SystemExit("release versions are not synchronized")
          print(values.pop())
          PY
          )"
          native_version="$(python scripts/native_release.py version)"
          if [ "${REQUESTED_VERSION}" != "${engine_version}" ] || \
             [ "${REQUESTED_VERSION}" != "${native_version}" ]; then
            echo "error: requested, engine, lock, and native versions must match" >&2
            exit 1
          fi
          escaped_version="${REQUESTED_VERSION//./\\.}"
          if ! grep -Eq "^## v${escaped_version} \\([0-9]{4}-[0-9]{2}-[0-9]{2}\\)$" CHANGELOG.md; then
            echo "error: CHANGELOG.md has no dated v${REQUESTED_VERSION} release entry" >&2
            exit 1
          fi
          engine_tag="v${REQUESTED_VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${engine_tag}" >/dev/null; then
            echo "error: immutable engine tag ${engine_tag} already exists" >&2
            exit 1
          fi
          python - "${REQUESTED_VERSION}" <<'PY'
          import re
          import subprocess
          import sys

          candidate = tuple(int(part) for part in sys.argv[1].split("."))
          output = subprocess.check_output(
              ["git", "tag", "--list", "v[0-9]*.[0-9]*.[0-9]*"], text=True
          )
          versions = []
          for tag in output.splitlines():
              match = re.fullmatch(r"v([0-9]+)\.([0-9]+)\.([0-9]+)", tag)
              if match:
                  versions.append(tuple(int(part) for part in match.groups()))
          if versions and candidate <= max(versions):
              raise SystemExit(
                  f"candidate {sys.argv[1]} does not advance newest tag "
                  + ".".join(str(part) for part in max(versions))
              )
          PY
          for workflow in test.yml build.yml; do
            response="$(
              gh api --method GET \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs" \
                --raw-field head_sha="${GITHUB_SHA}" \
                --raw-field event=push \
                --raw-field per_page=20
            )"
            status="$(printf '%s' "${response}" | jq -r --arg sha "${GITHUB_SHA}" \
              '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | last | .status // "missing"')"
            conclusion="$(printf '%s' "${response}" | jq -r --arg sha "${GITHUB_SHA}" \
              '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | last | .conclusion // "missing"')"
            if [ "${status}" != "completed" ] || [ "${conclusion}" != "success" ]; then
              echo "error: ${workflow} is not successful for ${GITHUB_SHA}: ${status}/${conclusion}" >&2
              exit 1
            fi
          done
          git diff --exit-code
          {
            echo "engine_tag=${engine_tag}"
            echo "engine_commit=${GITHUB_SHA}"
          } >> "${GITHUB_OUTPUT}"

      - name: Mint the release App token for this repository
        id: release_app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.OPENADAPT_RELEASE_APP_ID }}
          private-key: ${{ secrets.OPENADAPT_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read
          permission-contents: write
          permission-metadata: read

      - name: Bind Git only to the repository-scoped release App token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.release_app.outputs.token }}

      - name: Require the exact release App identity
        env:
          CONFIGURED_RELEASE_APP_ID: ${{ vars.OPENADAPT_RELEASE_APP_ID }}
          CONFIGURED_RELEASE_ACTOR_ID: ${{ vars.OPENADAPT_RELEASE_ACTOR_ID }}
          CONFIGURED_RELEASE_APP_INSTALLATION_ID: ${{ vars.OPENADAPT_RELEASE_APP_INSTALLATION_ID }}
          GH_TOKEN: ${{ steps.release_app.outputs.token }}
          RELEASE_APP_SLUG: ${{ steps.release_app.outputs.app-slug }}
          TOKEN_INSTALLATION_ID: ${{ steps.release_app.outputs['installation-id'] }}
        shell: bash
        run: |
          if [ "${RELEASE_APP_SLUG}" != openadapt-release ] || \
             [ "${CONFIGURED_RELEASE_APP_ID}" != "${RELEASE_APP_ID}" ] || \
             [ "${CONFIGURED_RELEASE_ACTOR_ID}" != "${RELEASE_APP_ACTOR_ID}" ] || \
             [ "${CONFIGURED_RELEASE_APP_INSTALLATION_ID}" != "${RELEASE_APP_INSTALLATION_ID}" ] || \
             [ "${TOKEN_INSTALLATION_ID}" != "${RELEASE_APP_INSTALLATION_ID}" ]; then
            echo "error: release token does not match the admitted App identity" >&2
            exit 1
          fi
          gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/immutable-releases" > immutable-releases.json
          python scripts/production_release_contract.py validate-immutable-releases \
            --file immutable-releases.json

      - name: Create only the exact candidate tag
        env:
          APP_TOKEN: ${{ steps.release_app.outputs.token }}
          ENGINE_TAG: ${{ steps.candidate.outputs.engine_tag }}
          ENGINE_COMMIT: ${{ steps.candidate.outputs.engine_commit }}
        shell: bash
        run: |
          set -euo pipefail
          current_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "${current_main}" != "${ENGINE_COMMIT}" ]; then
            echo "error: main changed before tag creation" >&2
            exit 1
          fi
          git config user.name "openadapt-release[bot]"
          git config user.email "openadapt-release[bot]@users.noreply.github.com"
          git tag -a "${ENGINE_TAG}" "${ENGINE_COMMIT}" \
            -m "OpenAdapt Desktop ${ENGINE_TAG#v}"
          app_basic="$(printf 'x-access-token:%s' "${APP_TOKEN}" | base64 | tr -d '\r\n')"
          printf '::add-mask::%s\n' "${app_basic}"
          GIT_TERMINAL_PROMPT=0 \
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${app_basic}" \
            git push origin "refs/tags/${ENGINE_TAG}:refs/tags/${ENGINE_TAG}"
          unset app_basic
          local_object="$(git rev-parse "refs/tags/${ENGINE_TAG}")"
          remote_object="$(git ls-remote --refs origin "refs/tags/${ENGINE_TAG}" | cut -f1)"
          remote_commit="$(git ls-remote origin "refs/tags/${ENGINE_TAG}^{}" | cut -f1)"
          if [ "${remote_object}" != "${local_object}" ] || \
             [ "${remote_commit}" != "${ENGINE_COMMIT}" ]; then
            echo "error: created annotated tag differs from the reviewed candidate" >&2
            exit 1
          fi

  authorize-release-tag:
    name: Require the release App tag event
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions: {}
    steps:
      - name: Refuse a tag outside the release App identity
        env:
          CONFIGURED_RELEASE_ACTOR_ID: ${{ vars.OPENADAPT_RELEASE_ACTOR_ID }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_ACTOR}" != "openadapt-release[bot]" ] || \
             [ "${EVENT_ACTOR_ID}" != "${RELEASE_APP_ACTOR_ID}" ] || \
             [ "${CONFIGURED_RELEASE_ACTOR_ID}" != "${RELEASE_APP_ACTOR_ID}" ]; then
            echo "error: engine publication requires the openadapt-release App" >&2
            exit 1
          fi
          if [ "${GITHUB_REPOSITORY}" != "OpenAdaptAI/openadapt-desktop" ] || \
             [ "${GITHUB_REF_TYPE}" != "tag" ] || \
             ! printf '%s' "${GITHUB_REF}" | grep -Eq '^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "error: engine publication event identity is invalid" >&2
            exit 1
          fi

  publish-tagged-engine:
    name: Publish the exact tagged engine release
    needs: authorize-release-tag
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.authorize-release-tag.result == 'success' &&
      github.actor == 'openadapt-release[bot]' &&
      github.actor_id == '321543906'
    runs-on: ubuntu-22.04
    environment: pypi
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Checkout the exact engine tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Refuse a noncanonical tag, version, source, or event
        env:
          CONFIGURED_RELEASE_ACTOR_ID: ${{ vars.OPENADAPT_RELEASE_ACTOR_ID }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "push" ] || \
             ! printf '%s' "${GITHUB_REF}" | grep -Eq '^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "error: engine publication requires an exact stable vX.Y.Z push" >&2
            exit 1
          fi
          if [ "${GITHUB_ACTOR}" != "openadapt-release[bot]" ] || \
             [ "${EVENT_ACTOR_ID}" != "${RELEASE_APP_ACTOR_ID}" ] || \
             [ "${CONFIGURED_RELEASE_ACTOR_ID}" != "${RELEASE_APP_ACTOR_ID}" ] || \
             [ "${GITHUB_REPOSITORY}" != "OpenAdaptAI/openadapt-desktop" ]; then
            echo "error: engine publication requires the repository release App" >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF}" != "refs/tags/v${version}" ]; then
            echo "error: ref and version differ" >&2
            exit 1
          fi
          if [ "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" != "tag" ]; then
            echo "error: engine release requires an annotated tag" >&2
            exit 1
          fi
          tag_commit="$(git rev-parse --verify "${GITHUB_REF_NAME}^{commit}")"
          if [ "${tag_commit}" != "${GITHUB_SHA}" ]; then
            echo "error: workflow SHA differs from the immutable tag" >&2
            exit 1
          fi
          git fetch --force origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main; then
            echo "error: tagged candidate is not contained in protected main" >&2
            exit 1
          fi
          python scripts/check_release_consistency.py
          python scripts/verify_release_lock.py
          engine_version="$(python - <<'PY'
          from scripts.check_release_consistency import release_versions
          values = set(release_versions().values())
          if len(values) != 1:
              raise SystemExit("release versions are not synchronized")
          print(values.pop())
          PY
          )"
          native_version="$(python scripts/native_release.py version)"
          if [ "${version}" != "${engine_version}" ] || [ "${version}" != "${native_version}" ]; then
            echo "error: tag, engine, lock, and native versions differ" >&2
            exit 1
          fi
          escaped_version="${version//./\\.}"
          if ! grep -Eq "^## v${escaped_version} \\([0-9]{4}-[0-9]{2}-[0-9]{2}\\)$" CHANGELOG.md; then
            echo "error: tagged candidate has no dated changelog entry" >&2
            exit 1
          fi
          for workflow in test.yml build.yml; do
            response="$(
              gh api --method GET \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs" \
                --raw-field head_sha="${GITHUB_SHA}" \
                --raw-field event=push \
                --raw-field per_page=20
            )"
            conclusion="$(printf '%s' "${response}" | jq -r --arg sha "${GITHUB_SHA}" \
              '[.workflow_runs[] | select(.head_sha == $sha and .status == "completed")] | sort_by(.created_at) | last | .conclusion // "missing"')"
            if [ "${conclusion}" != "success" ]; then
              echo "error: ${workflow} is not successful for ${GITHUB_SHA}" >&2
              exit 1
            fi
          done

      # This preflight runs before the first irreversible publication. The
      # later token is fresh because a complete PyPI verification can outlive
      # the short GitHub App token lifetime.
      - name: Preflight the release App before PyPI publication
        id: release_app_preflight
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.OPENADAPT_RELEASE_APP_ID }}
          private-key: ${{ secrets.OPENADAPT_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read
          permission-contents: write
          permission-metadata: read

      - name: Require the exact preflight release App identity
        env:
          CONFIGURED_RELEASE_APP_ID: ${{ vars.OPENADAPT_RELEASE_APP_ID }}
          CONFIGURED_RELEASE_ACTOR_ID: ${{ vars.OPENADAPT_RELEASE_ACTOR_ID }}
          CONFIGURED_RELEASE_APP_INSTALLATION_ID: ${{ vars.OPENADAPT_RELEASE_APP_INSTALLATION_ID }}
          GH_TOKEN: ${{ steps.release_app_preflight.outputs.token }}
          RELEASE_APP_SLUG: ${{ steps.release_app_preflight.outputs.app-slug }}
          TOKEN_INSTALLATION_ID: ${{ steps.release_app_preflight.outputs['installation-id'] }}
        shell: bash
        run: |
          if [ "${RELEASE_APP_SLUG}" != openadapt-release ] || \
             [ "${CONFIGURED_RELEASE_APP_ID}" != "${RELEASE_APP_ID}" ] || \
             [ "${CONFIGURED_RELEASE_ACTOR_ID}" != "${RELEASE_APP_ACTOR_ID}" ] || \
             [ "${CONFIGURED_RELEASE_APP_INSTALLATION_ID}" != "${RELEASE_APP_INSTALLATION_ID}" ] || \
             [ "${TOKEN_INSTALLATION_ID}" != "${RELEASE_APP_INSTALLATION_ID}" ]; then
            echo "error: preflight token does not match the admitted App identity" >&2
            exit 1
          fi
          gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/immutable-releases" > immutable-releases.json
          python scripts/production_release_contract.py validate-immutable-releases \
            --file immutable-releases.json

      - name: Build and verify exact publication artifacts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check uv==0.11.29
          uv build --wheel --sdist
          python scripts/check_release_consistency.py --require-dist
          python scripts/check_source_boundary.py --require-dist
          python scripts/verify_build_artifact.py python-distribution

      - name: Authenticate any existing PyPI files before skip-existing
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          status="$(curl --show-error --silent --location \
            --connect-timeout 10 --max-time 30 \
            --output pypi-existing.json \
            --write-out '%{http_code}' \
            "https://pypi.org/pypi/openadapt-desktop/${version}/json")"
          if [ "${status}" = 404 ]; then
            exit 0
          fi
          if [ "${status}" != 200 ]; then
            echo "error: PyPI lookup returned HTTP ${status}" >&2
            exit 1
          fi
          python scripts/verify_pypi_release.py \
            --metadata pypi-existing.json \
            --directory dist \
            --version "${version}" \
            --allow-subset
          mkdir pypi-existing-files
          while IFS=$'\t' read -r name url; do
            curl --fail --show-error --silent --location \
              --connect-timeout 10 --max-time 60 \
              --output "pypi-existing-files/${name}" "${url}"
            cmp "dist/${name}" "pypi-existing-files/${name}"
          done < <(jq -r '.urls[] | [.filename, .url] | @tsv' pypi-existing.json)

      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
          print-hash: true

      - name: Verify the exact public PyPI distributions
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          published=false
          for attempt in $(seq 1 30); do
            if curl --fail --show-error --silent --location \
              --connect-timeout 10 --max-time 30 \
              "https://pypi.org/pypi/openadapt-desktop/${version}/json" \
              --output pypi-release.json; then
              published=true
              break
            fi
            echo "PyPI has not exposed ${version} yet (attempt ${attempt}/30)."
            sleep 10
          done
          if [ "${published}" != true ]; then
            echo "error: PyPI did not expose ${version} after publication" >&2
            exit 1
          fi
          python scripts/verify_pypi_release.py \
            --metadata pypi-release.json \
            --directory dist \
            --version "${version}"
          mkdir pypi-published-files
          while IFS=$'\t' read -r name url; do
            curl --fail --show-error --silent --location \
              --connect-timeout 10 --max-time 60 \
              --output "pypi-published-files/${name}" "${url}"
            cmp "dist/${name}" "pypi-published-files/${name}"
          done < <(jq -r '.urls[] | [.filename, .url] | @tsv' pypi-release.json)

      - name: Mint the release App token for GitHub publication
        id: release_app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.OPENADAPT_RELEASE_APP_ID }}
          private-key: ${{ secrets.OPENADAPT_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read
          permission-contents: write
          permission-metadata: read

      - name: Require the exact release App identity
        env:
          CONFIGURED_RELEASE_APP_ID: ${{ vars.OPENADAPT_RELEASE_APP_ID }}
          CONFIGURED_RELEASE_ACTOR_ID: ${{ vars.OPENADAPT_RELEASE_ACTOR_ID }}
          CONFIGURED_RELEASE_APP_INSTALLATION_ID: ${{ vars.OPENADAPT_RELEASE_APP_INSTALLATION_ID }}
          GH_TOKEN: ${{ steps.release_app.outputs.token }}
          RELEASE_APP_SLUG: ${{ steps.release_app.outputs.app-slug }}
          TOKEN_INSTALLATION_ID: ${{ steps.release_app.outputs['installation-id'] }}
        shell: bash
        run: |
          if [ "${RELEASE_APP_SLUG}" != openadapt-release ] || \
             [ "${CONFIGURED_RELEASE_APP_ID}" != "${RELEASE_APP_ID}" ] || \
             [ "${CONFIGURED_RELEASE_ACTOR_ID}" != "${RELEASE_APP_ACTOR_ID}" ] || \
             [ "${CONFIGURED_RELEASE_APP_INSTALLATION_ID}" != "${RELEASE_APP_INSTALLATION_ID}" ] || \
             [ "${TOKEN_INSTALLATION_ID}" != "${RELEASE_APP_INSTALLATION_ID}" ]; then
            echo "error: release token does not match the admitted App identity" >&2
            exit 1
          fi
          gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/immutable-releases" > immutable-releases.json
          python scripts/production_release_contract.py validate-immutable-releases \
            --file immutable-releases.json

      - name: Resolve or create the exact engine release draft
        id: release_state
        env:
          GH_TOKEN: ${{ steps.release_app.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          release_id="$(gh release view "${tag}" --json databaseId --jq .databaseId 2>/dev/null || true)"
          if [ -n "${release_id}" ]; then
            gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${GITHUB_REPOSITORY}/releases/${release_id}" > release-api.json
            if jq -e '.draft == false and .immutable == true' release-api.json >/dev/null; then
              mkdir published-engine
              gh release download "${tag}" --dir published-engine --pattern '*'
              python scripts/native_release.py validate-github-release \
                --file release-api.json \
                --directory published-engine \
                --repository "${GITHUB_REPOSITORY}" \
                --tag "${tag}" \
                --phase published
              gh release view "${tag}" \
                --json author,databaseId,isDraft,isPrerelease,publishedAt,tagName,url \
                > published-engine-release.json
              python scripts/native_release.py validate-engine-inventory \
                --directory published-engine \
                --release published-engine-release.json \
                --repository "${GITHUB_REPOSITORY}" \
                --engine-tag "${tag}" \
                --engine-commit "${GITHUB_SHA}" \
                --local-engine-directory dist
              python scripts/native_release.py validate-exact-engine-inventory \
                --directory published-engine \
                --release published-engine-release.json \
                --repository "${GITHUB_REPOSITORY}" \
                --engine-tag "${tag}" \
                --engine-commit "${GITHUB_SHA}"
              echo "state=published" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            if ! jq -e \
              '.draft == true and .prerelease == false and .immutable == false and
               .author.login == "openadapt-release[bot]" and .author.id == 321543906' \
              release-api.json >/dev/null; then
              echo "error: existing engine release is neither an exact draft nor immutable" >&2
              exit 1
            fi
          else
            gh release create "${tag}" \
              --draft \
              --verify-tag \
              --title "OpenAdapt Desktop ${tag#v}" \
              --generate-notes
          fi
          gh release view "${tag}" \
            --json author,databaseId,isDraft,isPrerelease,publishedAt,tagName,url \
            > engine-release-draft.json
          python scripts/native_release.py validate-engine-release \
            --file engine-release-draft.json \
            --repository "${GITHUB_REPOSITORY}" \
            --engine-tag "${tag}" \
            --engine-commit "${GITHUB_SHA}" \
            --allow-draft
          echo "state=draft" >> "${GITHUB_OUTPUT}"

      - name: Write the exact-tag engine release receipt
        if: steps.release_state.outputs.state == 'draft'
        shell: bash
        run: |
          set -euo pipefail
          engine_tag="${GITHUB_REF_NAME}"
          python scripts/native_release.py write-engine-provenance \
            --output openadapt-desktop-engine-release-provenance.json \
            --directory dist \
            --release engine-release-draft.json \
            --repository "${GITHUB_REPOSITORY}" \
            --engine-tag "${engine_tag}" \
            --engine-commit "${GITHUB_SHA}" \
            --workflow-ref "${GITHUB_WORKFLOW_REF}" \
            --workflow-commit "${GITHUB_WORKFLOW_SHA}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --runner-environment "${RUNNER_ENVIRONMENT}"

      - name: Attest the engine release receipt
        if: steps.release_state.outputs.state == 'draft'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: openadapt-desktop-engine-release-provenance.json

      - name: Assemble and publish the immutable engine release
        if: steps.release_state.outputs.state == 'draft'
        env:
          GH_TOKEN: ${{ steps.release_app.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          engine_tag="${GITHUB_REF_NAME}"
          mkdir release-upload
          cp dist/*.whl dist/*.tar.gz release-upload/
          cp openadapt-desktop-engine-release-provenance.json release-upload/
          receipt=release-upload/openadapt-desktop-engine-release-provenance.json
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${engine_tag}"
          gh attestation verify "${receipt}" \
            --repo "${GITHUB_REPOSITORY}" \
            --cert-identity "${identity}" \
            --cert-oidc-issuer "https://token.actions.githubusercontent.com" \
            --deny-self-hosted-runners
          gh release upload "${engine_tag}" release-upload/* --clobber
          release_id="$(gh release view "${engine_tag}" --json databaseId --jq .databaseId)"
          gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}" > draft-release-api.json
          python scripts/native_release.py validate-github-release \
            --file draft-release-api.json \
            --directory release-upload \
            --repository "${GITHUB_REPOSITORY}" \
            --tag "${engine_tag}" \
            --phase draft
          gh release edit "${engine_tag}" --draft=false

      - name: Verify the exact immutable engine release
        env:
          GH_TOKEN: ${{ steps.release_app.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          engine_tag="${GITHUB_REF_NAME}"
          receipt=openadapt-desktop-engine-release-provenance.json
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${engine_tag}"
          mkdir remote-engine
          gh release download "${engine_tag}" --dir remote-engine --pattern '*'
          release_id="$(gh release view "${engine_tag}" --json databaseId --jq .databaseId)"
          for attempt in $(seq 1 30); do
            gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${GITHUB_REPOSITORY}/releases/${release_id}" > published-release-api.json
            if jq -e \
              '.immutable == true and (.assets | all(.digest | type == "string"))' \
              published-release-api.json >/dev/null; then
              break
            fi
            echo "Waiting for immutable engine release metadata (${attempt}/30)."
            sleep 2
          done
          jq -e '.immutable == true and (.assets | all(.digest | type == "string"))' \
            published-release-api.json >/dev/null
          python scripts/native_release.py validate-github-release \
            --file published-release-api.json \
            --directory remote-engine \
            --repository "${GITHUB_REPOSITORY}" \
            --tag "${engine_tag}" \
            --phase published
          gh release view "${engine_tag}" \
            --json author,databaseId,isDraft,isPrerelease,publishedAt,tagName,url \
            > engine-release.json
          gh attestation verify "remote-engine/${receipt}" \
            --repo "${GITHUB_REPOSITORY}" \
            --cert-identity "${identity}" \
            --cert-oidc-issuer "https://token.actions.githubusercontent.com" \
            --deny-self-hosted-runners
          python scripts/native_release.py validate-engine-provenance \
            --file "remote-engine/${receipt}" \
            --directory remote-engine \
            --release engine-release.json \
            --repository "${GITHUB_REPOSITORY}" \
            --engine-tag "${engine_tag}" \
            --engine-commit "${GITHUB_SHA}"
          python scripts/native_release.py validate-exact-engine-inventory \
            --directory remote-engine \
            --release engine-release.json \
            --repository "${GITHUB_REPOSITORY}" \
            --engine-tag "${engine_tag}" \
            --engine-commit "${GITHUB_SHA}"
