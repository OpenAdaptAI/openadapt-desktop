name: Build Desktop release package

on:
  workflow_call:
    inputs:
      version:
        description: Exact Desktop package version (X.Y.Z)
        required: true
        type: string
      source_commit:
        description: Exact protected-main source commit
        required: true
        type: string
      embedded_flow_version:
        description: Exact embedded openadapt-flow version
        required: true
        type: string
    outputs:
      candidate_artifact_name:
        description: Name of the exact 14-asset Actions artifact
        value: ${{ jobs.assemble.outputs.candidate_artifact_name }}

permissions:
  contents: read

jobs:
  validate:
    name: Validate the exact package build call
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Require the exact release.yml caller and protected-main inputs
        env:
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          CALLER_WORKFLOW_SHA: ${{ github.workflow_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          EMBEDDED_FLOW_VERSION: ${{ inputs.embedded_flow_version }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REPOSITORY}" != "OpenAdaptAI/openadapt-desktop" ] || \
             [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ] || \
             [ "${GITHUB_REF}" != "refs/heads/main" ] || \
             [ "${GITHUB_REF_TYPE}" != "branch" ] || \
             [ "${CALLER_WORKFLOW_REF}" != \
               "OpenAdaptAI/openadapt-desktop/.github/workflows/release.yml@refs/heads/main" ] || \
             [ "${CALLER_WORKFLOW_SHA}" != "${SOURCE_COMMIT}" ] || \
             [ "${GITHUB_SHA}" != "${SOURCE_COMMIT}" ] || \
             ! printf '%s' "${RELEASE_VERSION}" \
               | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || \
             ! printf '%s' "${EMBEDDED_FLOW_VERSION}" \
               | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || \
             ! printf '%s' "${SOURCE_COMMIT}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "error: Desktop package build requires the exact release.yml main call" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Require the exact package and embedded Flow versions
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          EMBEDDED_FLOW_VERSION: ${{ inputs.embedded_flow_version }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_COMMIT}"
          git fetch --force origin main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "${SOURCE_COMMIT}"
          python scripts/check_release_consistency.py
          test "$(python scripts/native_release.py version)" = "${RELEASE_VERSION}"
          actual_flow="$(
            python -c \
              'from scripts.smoke_test_native_installer import bundled_flow_version; print(bundled_flow_version())'
          )"
          test "${actual_flow}" = "${EMBEDDED_FLOW_VERSION}"
          git diff --exit-code

  python-distributions:
    name: Build wheel and source distribution once
    needs: validate
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true

      - name: Build and inspect the exact Python distributions
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          uv build --wheel --sdist
          python scripts/check_release_consistency.py --require-dist
          python scripts/check_source_boundary.py --require-dist
          python scripts/verify_build_artifact.py python-distribution
          mkdir dist/primary
          wheel="dist/openadapt_desktop-${RELEASE_VERSION}-py3-none-any.whl"
          sdist="dist/openadapt_desktop-${RELEASE_VERSION}.tar.gz"
          test -f "${wheel}"
          test -f "${sdist}"
          test "$(find dist -maxdepth 1 -type f -name 'openadapt_desktop-*' | wc -l | tr -d ' ')" = 2
          cp "${wheel}" "${sdist}" dist/primary/

      - name: Upload the exact Python pair for final assembly
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-primary-python-${{ github.run_attempt }}
          path: dist/primary/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  macos:
    name: macOS ${{ matrix.architecture }}
    needs: validate
    runs-on: ${{ matrix.os }}
    environment: native-release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            architecture: arm64
            target: aarch64-apple-darwin
          - os: macos-15-intel
            architecture: x86_64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.97.0"
          targets: ${{ matrix.target }}

      - name: Require Developer ID and notarization credentials
        id: signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: >-
          python scripts/native_signing.py preflight
          --platform macos
          --require-mode developer-id-notarized
          --github-output "${GITHUB_OUTPUT}"

      - name: Import the Developer ID certificate into an ephemeral keychain
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          certificate_path="${RUNNER_TEMP}/openadapt-developer-id.p12"
          keychain_path="${RUNNER_TEMP}/openadapt-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          printf '%s' "${APPLE_CERTIFICATE}" | base64 --decode > "${certificate_path}"
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" -k "${keychain_path}" \
            -P "${APPLE_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "${keychain_password}" "${keychain_path}"
          security list-keychain -d user -s "${keychain_path}"
          echo "OPENADAPT_APPLE_KEYCHAIN=${keychain_path}" >> "${GITHUB_ENV}"
          echo "OPENADAPT_APPLE_CERTIFICATE=${certificate_path}" >> "${GITHUB_ENV}"

      - name: Build the frozen engine sidecar
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          python scripts/sync_frozen_dependencies.py
          uv run python scripts/build_frozen_engine.py
          uv run python scripts/verify_build_artifact.py sidecar
          uv run python scripts/smoke_test_frozen_flow.py
          mkdir -p src-tauri/binaries
          cp dist/openadapt-engine \
            "src-tauri/binaries/openadapt-engine-${{ matrix.target }}"

      - name: Build the Developer ID signed and notarized DMG once
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: >-
          npm run tauri build --
          --bundles dmg
          --target ${{ matrix.target }}

      - name: Smoke-test install, signature policy, launch, and uninstall
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          artifacts=(src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          test "${#artifacts[@]}" -eq 1
          python scripts/smoke_test_native_installer.py \
            --artifact "${artifacts[0]}" \
            --app-path "${RUNNER_TEMP}/OpenAdapt Desktop.app" \
            --expected-architecture "${{ matrix.architecture }}" \
            --signing-mode developer-id-notarized \
            --signing-identity "${APPLE_SIGNING_IDENTITY}" \
            --signing-team-id "${APPLE_TEAM_ID}" \
            --launch-seconds 20

      - name: Stage the stable DMG name and closed verification record
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ARCHITECTURE: ${{ matrix.architecture }}
          EMBEDDED_FLOW_VERSION: ${{ inputs.embedded_flow_version }}
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/production_release_contract.py stage-platform \
            --bundle-root "src-tauri/target/${{ matrix.target }}/release/bundle" \
            --output dist/primary \
            --version "${RELEASE_VERSION}" \
            --platform macos \
            --architecture "${ARCHITECTURE}"
          dmg="dist/primary/OpenAdapt-Desktop-v${RELEASE_VERSION}-macos-${ARCHITECTURE}.dmg"
          codesign --verify --deep --strict --verbose=2 "${dmg}"
          spctl --assess --type open --context context:primary-signature \
            --verbose=4 "${dmg}"
          xcrun stapler validate "${dmg}"
          mountpoint="${RUNNER_TEMP}/openadapt-release-dmg-${ARCHITECTURE}"
          mkdir "${mountpoint}"
          hdiutil attach "${dmg}" -nobrowse -readonly -mountpoint "${mountpoint}" >/dev/null
          cleanup() {
            hdiutil detach "${mountpoint}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          apps=("${mountpoint}"/*.app)
          test "${#apps[@]}" -eq 1
          test -d "${apps[0]}"
          codesign --verify --deep --strict --verbose=2 "${apps[0]}"
          spctl --assess --type execute --verbose=4 "${apps[0]}"
          signature="$(codesign --display --verbose=4 "${apps[0]}" 2>&1)"
          printf '%s\n' "${signature}" | grep -Fx "Authority=${APPLE_SIGNING_IDENTITY}"
          printf '%s\n' "${signature}" | grep -Fx "TeamIdentifier=${APPLE_TEAM_ID}"
          printf '%s\n' "${signature}" | grep -Eq '^CodeDirectory .*flags=.*\(runtime\)'
          requirement="$(
            codesign --display --requirements - "${apps[0]}" 2>&1 \
              | sed -n 's/^designated => //p'
          )"
          test -n "${requirement}"
          signer_sha="sha256:$(
            printf '%s' "${APPLE_SIGNING_IDENTITY}" | shasum -a 256 | cut -d' ' -f1
          )"
          requirement_sha="sha256:$(
            printf '%s' "${requirement}" | shasum -a 256 | cut -d' ' -f1
          )"
          jq -cn \
            --arg team_id "${APPLE_TEAM_ID}" \
            --arg signer_sha "${signer_sha}" \
            --arg requirement_sha "${requirement_sha}" \
            '{
              method: "apple-developer-id-notarization",
              signature: {
                status: "valid",
                team_id: $team_id,
                signer_identity_sha256: $signer_sha,
                designated_requirement_sha256: $requirement_sha,
                hardened_runtime: true
              },
              notarization: {
                status: "accepted",
                ticket_stapled: true,
                ticket_validated: true,
                gatekeeper_assessment: "accepted"
              }
            }' > dist/macos-verification-input.json
          cleanup
          trap - EXIT
          python scripts/production_release_contract.py platform-verification \
            --directory dist/primary \
            --version "${RELEASE_VERSION}" \
            --source-commit "${SOURCE_COMMIT}" \
            --platform macos \
            --architecture "${ARCHITECTURE}" \
            --workflow-commit "${SOURCE_COMMIT}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --embedded-flow-version "${EMBEDDED_FLOW_VERSION}" \
            --verification dist/macos-verification-input.json \
            --output \
              "dist/primary/OpenAdapt-Desktop-v${RELEASE_VERSION}-macos-${ARCHITECTURE}-verification.json"

      - name: Upload the exact macOS pair for final assembly
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-primary-macos-${{ matrix.architecture }}-${{ github.run_attempt }}
          path: dist/primary/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Remove ephemeral Apple signing material
        if: always()
        shell: bash
        run: |
          if [ -n "${OPENADAPT_APPLE_KEYCHAIN:-}" ]; then
            security delete-keychain "${OPENADAPT_APPLE_KEYCHAIN}" || true
          fi
          if [ -n "${OPENADAPT_APPLE_CERTIFICATE:-}" ]; then
            rm -f "${OPENADAPT_APPLE_CERTIFICATE}"
          fi

  windows:
    name: Windows x86_64
    needs: validate
    runs-on: windows-2022
    environment: native-release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.97.0"
          targets: x86_64-pc-windows-msvc

      - name: Require timestamped Authenticode credentials
        id: signing
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
        shell: pwsh
        run: >-
          python scripts/native_signing.py preflight
          --platform windows
          --require-mode authenticode
          --github-output "$env:GITHUB_OUTPUT"

      - name: Import the PFX and write the Authenticode config
        if: steps.signing.outputs.method == 'pfx'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        shell: pwsh
        run: |
          $CertificatePath = Join-Path $env:RUNNER_TEMP "openadapt-code-signing.pfx"
          [IO.File]::WriteAllBytes(
            $CertificatePath,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          )
          $Password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $Certificate = Import-PfxCertificate `
            -FilePath $CertificatePath `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $Password | Where-Object HasPrivateKey | Select-Object -First 1
          if ($null -eq $Certificate) { throw "PFX did not import a private code-signing key" }
          $Expected = $env:WINDOWS_CERTIFICATE_THUMBPRINT.Replace(" ", "").ToUpperInvariant()
          if ($Certificate.Thumbprint -ne $Expected) {
            throw "Imported certificate thumbprint mismatch"
          }
          $ConfigPath = Join-Path $env:RUNNER_TEMP "openadapt-windows-signing.json"
          python scripts/native_signing.py windows-config `
            --output $ConfigPath `
            --thumbprint $Expected
          "OPENADAPT_WINDOWS_SIGNING_CONFIG=$ConfigPath" |
            Out-File $env:GITHUB_ENV -Append
          "OPENADAPT_WINDOWS_CERTIFICATE_PATH=$CertificatePath" |
            Out-File $env:GITHUB_ENV -Append

      - name: Install Trusted Signing and write its config
        if: steps.signing.outputs.method == 'trusted-signing'
        env:
          TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
        shell: pwsh
        run: |
          cargo install trusted-signing-cli --version 0.5.3 --locked
          $ConfigPath = Join-Path $env:RUNNER_TEMP "openadapt-windows-signing.json"
          python scripts/native_signing.py windows-trusted-signing-config `
            --output $ConfigPath `
            --endpoint $env:TRUSTED_SIGNING_ENDPOINT `
            --account $env:TRUSTED_SIGNING_ACCOUNT `
            --certificate-profile $env:TRUSTED_SIGNING_CERTIFICATE_PROFILE
          "OPENADAPT_WINDOWS_SIGNING_CONFIG=$ConfigPath" |
            Out-File $env:GITHUB_ENV -Append

      - name: Build the frozen engine sidecar
        shell: pwsh
        run: |
          npm ci --ignore-scripts
          python scripts/sync_frozen_dependencies.py
          uv run python scripts/build_frozen_engine.py
          uv run python scripts/verify_build_artifact.py sidecar
          uv run python scripts/smoke_test_frozen_flow.py
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item dist/openadapt-engine.exe `
            src-tauri/binaries/openadapt-engine-x86_64-pc-windows-msvc.exe

      - name: Build the signed MSI and NSIS installers once
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        shell: pwsh
        run: >-
          npm run tauri build --
          --bundles msi,nsis
          --target x86_64-pc-windows-msvc
          --config "$env:OPENADAPT_WINDOWS_SIGNING_CONFIG"

      - name: Smoke-test install, Authenticode, launch, and uninstall
        timeout-minutes: 15
        env:
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        shell: pwsh
        run: |
          $Msi = @(Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi")
          $Nsis = @(Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe")
          if ($Msi.Count -ne 1 -or $Nsis.Count -ne 1) {
            throw "Expected one MSI and one NSIS installer"
          }
          $Signature = @("--signing-mode", "authenticode")
          if ("${{ steps.signing.outputs.method }}" -eq "pfx") {
            $Signature += @("--signing-fingerprint", $env:WINDOWS_CERTIFICATE_THUMBPRINT)
          }
          python scripts/smoke_test_native_installer.py `
            --artifact $Msi[0].FullName `
            --app-path "$env:ProgramFiles/OpenAdapt Desktop/openadapt-desktop.exe" `
            --expected-architecture x86_64 `
            --allow-system-install `
            --launch-seconds 20 @Signature
          python scripts/smoke_test_native_installer.py `
            --artifact $Nsis[0].FullName `
            --app-path "$env:LOCALAPPDATA/OpenAdapt Desktop/openadapt-desktop.exe" `
            --uninstaller-path "$env:LOCALAPPDATA/OpenAdapt Desktop/uninstall.exe" `
            --expected-architecture x86_64 `
            --allow-system-install `
            --launch-seconds 20 @Signature

      - name: Stage stable installer names and the closed verification record
        env:
          EMBEDDED_FLOW_VERSION: ${{ inputs.embedded_flow_version }}
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        shell: pwsh
        run: |
          python scripts/production_release_contract.py stage-platform `
            --bundle-root src-tauri/target/x86_64-pc-windows-msvc/release/bundle `
            --output dist/primary `
            --version $env:RELEASE_VERSION `
            --platform windows `
            --architecture x86_64
          $Msi = Get-Item "dist/primary/OpenAdapt-Desktop-v$env:RELEASE_VERSION-windows-x86_64.msi"
          $Nsis = Get-Item "dist/primary/OpenAdapt-Desktop-v$env:RELEASE_VERSION-windows-x86_64-setup.exe"
          function Get-Sha256Bytes([byte[]] $Value) {
            return "sha256:" + [Convert]::ToHexString(
              [Security.Cryptography.SHA256]::HashData($Value)
            ).ToLowerInvariant()
          }
          function Get-Sha256Text([string] $Value) {
            return Get-Sha256Bytes ([Text.Encoding]::UTF8.GetBytes($Value))
          }
          $Records = foreach ($Artifact in @($Msi, $Nsis)) {
            $Signature = Get-AuthenticodeSignature -LiteralPath $Artifact.FullName
            if ($Signature.Status -ne "Valid") {
              throw "Authenticode status is $($Signature.Status): $($Artifact.Name)"
            }
            if ($null -eq $Signature.SignerCertificate) {
              throw "Missing signer certificate: $($Artifact.Name)"
            }
            if ($null -eq $Signature.TimeStamperCertificate) {
              throw "Missing timestamp certificate: $($Artifact.Name)"
            }
            [ordered]@{
              artifact_name = $Artifact.Name
              status = "valid"
              signer_certificate_sha256 = Get-Sha256Bytes $Signature.SignerCertificate.RawData
              signer_subject_sha256 = Get-Sha256Text $Signature.SignerCertificate.Subject
              timestamp_certificate_sha256 = Get-Sha256Bytes `
                $Signature.TimeStamperCertificate.RawData
              timestamp_subject_sha256 = Get-Sha256Text `
                $Signature.TimeStamperCertificate.Subject
            }
          }
          $Verification = [ordered]@{
            method = "authenticode"
            file_digest_algorithm = "sha256"
            signatures = @($Records)
          }
          $Verification | ConvertTo-Json -Depth 6 |
            Set-Content -Encoding utf8 dist/windows-verification-input.json
          python scripts/production_release_contract.py platform-verification `
            --directory dist/primary `
            --version $env:RELEASE_VERSION `
            --source-commit $env:SOURCE_COMMIT `
            --platform windows `
            --architecture x86_64 `
            --workflow-commit $env:SOURCE_COMMIT `
            --run-id $env:GITHUB_RUN_ID `
            --run-attempt $env:GITHUB_RUN_ATTEMPT `
            --embedded-flow-version $env:EMBEDDED_FLOW_VERSION `
            --verification dist/windows-verification-input.json `
            --output `
              "dist/primary/OpenAdapt-Desktop-v$env:RELEASE_VERSION-windows-x86_64-verification.json"

      - name: Upload the exact Windows set for final assembly
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-primary-windows-x86_64-${{ github.run_attempt }}
          path: dist/primary/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Remove ephemeral Windows signing material
        if: always() && steps.signing.outputs.method == 'pfx'
        env:
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        shell: pwsh
        run: |
          Get-ChildItem Cert:\CurrentUser\My | Where-Object {
            $_.Thumbprint -eq $env:WINDOWS_CERTIFICATE_THUMBPRINT.Replace(" ", "").ToUpperInvariant()
          } | Remove-Item -Force
          if ($env:OPENADAPT_WINDOWS_CERTIFICATE_PATH) {
            Remove-Item -LiteralPath $env:OPENADAPT_WINDOWS_CERTIFICATE_PATH `
              -Force -ErrorAction SilentlyContinue
          }

  linux:
    name: Linux x86_64
    needs: validate
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Linux bundle dependencies
        timeout-minutes: 10
        shell: bash
        run: |
          set -uo pipefail
          sudo sed -i \
            's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/apt-mirrors.txt 2>/dev/null || true
          update_ok=""
          for attempt in 1 2 3; do
            if sudo apt-get update; then
              update_ok=1
              break
            fi
            echo "::warning::apt-get update failed (attempt ${attempt}/3); retrying"
            sleep "$((attempt * 10))"
          done
          if [ -z "${update_ok}" ]; then
            echo "::error::apt-get update failed three times"
            exit 1
          fi
          set -e
          sudo apt-get install -y --no-install-recommends \
            dbus \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            xdg-utils \
            xvfb

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.97.0"
          targets: x86_64-unknown-linux-gnu

      - name: Build the frozen engine sidecar
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          python scripts/sync_frozen_dependencies.py
          uv run python scripts/build_frozen_engine.py
          uv run python scripts/verify_build_artifact.py sidecar
          uv run python scripts/smoke_test_frozen_flow.py
          mkdir -p src-tauri/binaries
          cp dist/openadapt-engine \
            src-tauri/binaries/openadapt-engine-x86_64-unknown-linux-gnu

      - name: Build the DEB and AppImage once
        run: >-
          npm run tauri build --
          --bundles deb,appimage
          --target x86_64-unknown-linux-gnu

      - name: Smoke-test install, launch, and uninstall
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
        shell: bash
        run: |
          set -euo pipefail
          deb=(src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb)
          appimage=(src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage)
          test "${#deb[@]}" -eq 1
          test "${#appimage[@]}" -eq 1
          dbus-run-session -- xvfb-run --auto-servernum \
            python scripts/smoke_test_native_installer.py \
            --artifact "${deb[0]}" \
            --app-path /usr/bin/openadapt-desktop \
            --expected-architecture x86_64 \
            --allow-system-install \
            --launch-seconds 20
          dbus-run-session -- xvfb-run --auto-servernum \
            python scripts/smoke_test_native_installer.py \
            --artifact "${appimage[0]}" \
            --app-path "${RUNNER_TEMP}/OpenAdapt-Desktop.AppImage" \
            --expected-architecture x86_64 \
            --launch-seconds 20

      - name: Stage the stable Linux package names
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/production_release_contract.py stage-platform \
            --bundle-root src-tauri/target/x86_64-unknown-linux-gnu/release/bundle \
            --output dist/primary \
            --version "${RELEASE_VERSION}" \
            --platform linux \
            --architecture x86_64

      - name: Attest the exact Linux package bytes
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.0.0
        with:
          subject-path: |
            dist/primary/OpenAdapt-Desktop-v${{ inputs.version }}-linux-x86_64.AppImage
            dist/primary/OpenAdapt-Desktop-v${{ inputs.version }}-linux-x86_64.deb

      - name: Verify Linux provenance and write the closed verification record
        env:
          EMBEDDED_FLOW_VERSION: ${{ inputs.embedded_flow_version }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          appimage="OpenAdapt-Desktop-v${RELEASE_VERSION}-linux-x86_64.AppImage"
          deb="OpenAdapt-Desktop-v${RELEASE_VERSION}-linux-x86_64.deb"
          identity="https://github.com/OpenAdaptAI/openadapt-desktop/.github/workflows/release.yml@refs/heads/main"
          for name in "${appimage}" "${deb}"; do
            gh attestation verify "dist/primary/${name}" \
              --repo "${GITHUB_REPOSITORY}" \
              --cert-identity "${identity}" \
              --cert-oidc-issuer "https://token.actions.githubusercontent.com" \
              --deny-self-hosted-runners
          done
          appimage_sha="sha256:$(sha256sum "dist/primary/${appimage}" | cut -d' ' -f1)"
          deb_sha="sha256:$(sha256sum "dist/primary/${deb}" | cut -d' ' -f1)"
          jq -cn \
            --arg identity "${identity}" \
            --arg appimage "${appimage}" \
            --arg appimage_sha "${appimage_sha}" \
            --arg deb "${deb}" \
            --arg deb_sha "${deb_sha}" \
            '{
              method: "github-oidc-attestation",
              oidc_issuer: "https://token.actions.githubusercontent.com",
              certificate_identity: $identity,
              predicate_type: "https://slsa.dev/provenance/v1",
              build_type: "https://actions.github.io/buildtypes/workflow/v1",
              subjects: [
                {name: $appimage, sha256: $appimage_sha},
                {name: $deb, sha256: $deb_sha}
              ]
            }' > dist/linux-verification-input.json
          python scripts/production_release_contract.py platform-verification \
            --directory dist/primary \
            --version "${RELEASE_VERSION}" \
            --source-commit "${SOURCE_COMMIT}" \
            --platform linux \
            --architecture x86_64 \
            --workflow-commit "${SOURCE_COMMIT}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --embedded-flow-version "${EMBEDDED_FLOW_VERSION}" \
            --verification dist/linux-verification-input.json \
            --output \
              "dist/primary/OpenAdapt-Desktop-v${RELEASE_VERSION}-linux-x86_64-verification.json"

      - name: Upload the exact Linux set for final assembly
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-primary-linux-x86_64-${{ github.run_attempt }}
          path: dist/primary/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  assemble:
    name: Assemble the exact 14-asset candidate
    needs: [validate, python-distributions, macos, windows, linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      candidate_artifact_name: ${{ steps.candidate.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download only this attempt's exact primary outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-primary-*-${{ github.run_attempt }}
          path: release-assets
          merge-multiple: true

      - name: Refuse anything except the eight primary files and four verification records
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')" = 12
          test -z "$(find release-assets -mindepth 1 -type d -print -quit)"
          python - "${RELEASE_VERSION}" <<'PY'
          import sys
          from pathlib import Path
          from scripts.production_release_contract import expected_asset_names

          version = sys.argv[1]
          expected = expected_asset_names(version) - {
              "SHA256SUMS",
              f"OpenAdapt-Desktop-v{version}.cyclonedx.json",
          }
          actual = {path.name for path in Path("release-assets").iterdir()}
          if actual != expected:
              raise SystemExit(
                  f"pre-SBOM Desktop assets differ: "
                  f"missing={sorted(expected - actual)}, "
                  f"unexpected={sorted(actual - expected)}"
              )
          PY

      - name: Generate the CycloneDX SBOM from the exact staged set
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: release-assets
          format: cyclonedx-json
          output-file: release-assets/OpenAdapt-Desktop-v${{ inputs.version }}.cyclonedx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate checksums and validate every public byte
        env:
          EMBEDDED_FLOW_VERSION: ${{ inputs.embedded_flow_version }}
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -maxdepth 1 -type f \
            ! -name SHA256SUMS -print0 \
            | LC_ALL=C sort -z \
            | xargs -0 sha256sum \
            | sed 's#  release-assets/#  #' \
            > release-assets/SHA256SUMS
          mkdir contract
          python scripts/production_release_contract.py inventory \
            --directory release-assets \
            --version "${RELEASE_VERSION}" \
            --output contract/desktop-artifact-inventory.json
          python - "${RELEASE_VERSION}" "${SOURCE_COMMIT}" "${EMBEDDED_FLOW_VERSION}" <<'PY'
          import sys
          from pathlib import Path
          from scripts.production_release_contract import validate_release_asset_contents

          validate_release_asset_contents(
              Path("release-assets"),
              version=sys.argv[1],
              source_commit=sys.argv[2],
              embedded_flow_version=sys.argv[3],
          )
          PY
          test "$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')" = 14
          test -z "$(find release-assets -mindepth 1 -type d -print -quit)"
          test -z "$(find release-assets -mindepth 2 -print -quit)"

      - name: Name the exact candidate artifact
        id: candidate
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          echo "name=desktop-production-assets-${RELEASE_VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            >> "${GITHUB_OUTPUT}"

      - name: Upload one flat 14-asset candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.candidate.outputs.name }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
