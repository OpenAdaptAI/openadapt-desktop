name: Release managed FFmpeg Support runtime

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ffmpeg-support-release
  cancel-in-progress: false

env:
  RELEASE_DISPATCH_ACTOR_ID: "774615"
  RELEASE_APP_ID: "4730708"
  RELEASE_APP_ACTOR_ID: "321543906"
  RELEASE_APP_INSTALLATION_ID: "156835568"
  FFMPEG_VERSION: "8.1.2"
  RUNTIME_REVISION: "r2"
  SOURCE_SHA256: "464beb5e7bf0c311e68b45ae2f04e9cc2af88851abb4082231742a74d97b524c"
  SOURCE_SIGNATURE_SHA256: "0a0963fccd70597838073f3e31b20f4a4d8cc2b5e577472c9a5a1f22624246f8"
  SIGNING_KEY_SHA256: "397b3becedcd5a98769967ff1ff8501ddc89f8368b8f766e4701377d7dbaabe5" # gitleaks:allow
  SIGNING_KEY_FINGERPRINT: "FCF986EA15E6E293A5644F10B4322F04D67658D8" # gitleaks:allow
  SUPPORT_TAG_CREATION_RULESET: "OpenAdapt policy: FFmpeg runtime tag creation"
  SUPPORT_TAG_IMMUTABILITY_RULESET: "OpenAdapt policy: immutable FFmpeg runtime tags"

jobs:
  authorize-runtime-dispatch:
    name: Refuse an invalid managed-runtime dispatch
    runs-on: ubuntu-22.04
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the exact repository, human actor, main ref, and source commit
        env:
          EVENT_ACTOR_ID: ${{ github.actor_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ] || \
             [ "${EVENT_ACTOR_ID}" != "${RELEASE_DISPATCH_ACTOR_ID}" ] || \
             [ "${GITHUB_REPOSITORY}" != "OpenAdaptAI/openadapt-desktop" ] || \
             [ "${GITHUB_REF}" != "refs/heads/main" ] || \
             [ "${GITHUB_REF_TYPE}" != "branch" ]; then
            echo "error: managed FFmpeg Support release requires the admitted human actor on Desktop main" >&2
            exit 1
          fi
          git fetch --force origin main:refs/remotes/origin/main
          current_main="$(git rev-parse --verify refs/remotes/origin/main)"
          if [ "${GITHUB_SHA}" != "${current_main}" ]; then
            echo "error: dispatched managed FFmpeg candidate is not current main" >&2
            exit 1
          fi
          tag="ffmpeg-runtime-v${FFMPEG_VERSION}-${RUNTIME_REVISION}"
          if ! printf '%s' "${tag}" \
            | grep -Eq '^ffmpeg-runtime-v[0-9]+\.[0-9]+\.[0-9]+-r[1-9][0-9]*$'; then
            echo "error: managed FFmpeg Support tag is not canonical" >&2
            exit 1
          fi

  source:
    name: Verify official FFmpeg source
    needs: authorize-runtime-dispatch
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download source, detached signature, and release key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/ffmpeg-source
          curl --fail --show-error --silent --location --retry 5 \
            --retry-all-errors --connect-timeout 20 --max-time 300 \
            "https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz" \
            --output "dist/ffmpeg-source/ffmpeg-${FFMPEG_VERSION}.tar.xz"
          curl --fail --show-error --silent --location --retry 5 \
            --retry-all-errors --connect-timeout 20 --max-time 300 \
            "https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz.asc" \
            --output "dist/ffmpeg-source/ffmpeg-${FFMPEG_VERSION}.tar.xz.asc"
          curl --fail --show-error --silent --location --retry 5 \
            --retry-all-errors --connect-timeout 20 --max-time 300 \
            https://ffmpeg.org/ffmpeg-devel.asc \
            --output dist/ffmpeg-source/ffmpeg-devel.asc

      - name: Verify source bytes and FFmpeg release signature
        shell: bash
        run: |
          set -euo pipefail
          source_archive="dist/ffmpeg-source/ffmpeg-${FFMPEG_VERSION}.tar.xz"
          signature="${source_archive}.asc"
          key=dist/ffmpeg-source/ffmpeg-devel.asc
          test "$(sha256sum "${source_archive}" | cut -d' ' -f1)" = "${SOURCE_SHA256}"
          test "$(sha256sum "${signature}" | cut -d' ' -f1)" = "${SOURCE_SIGNATURE_SHA256}"
          test "$(sha256sum "${key}" | cut -d' ' -f1)" = "${SIGNING_KEY_SHA256}"
          export GNUPGHOME="${RUNNER_TEMP}/ffmpeg-gnupg"
          mkdir -m 700 "${GNUPGHOME}"
          gpg --batch --import "${key}"
          fingerprint="$(
            gpg --batch --with-colons --fingerprint \
              | awk -F: '$1 == "fpr" { print $10; exit }'
          )"
          test "${fingerprint}" = "${SIGNING_KEY_FINGERPRINT}"
          gpg --batch --verify "${signature}" "${source_archive}"

      - name: Upload the verified source once
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffmpeg-official-source
          path: dist/ffmpeg-source/*
          if-no-files-found: error
          retention-days: 30

  build:
    name: Runtime (${{ matrix.label }})
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            os: macos-15
            target: aarch64-apple-darwin
          - label: macOS x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - label: Windows x86_64
            os: windows-2022
            target: x86_64-pc-windows-msvc
          - label: Linux x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the one verified source artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: ffmpeg-official-source
          path: dist/ffmpeg-source

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        shell: bash
        timeout-minutes: 10
        run: |
          set -uo pipefail
          sudo sed -i \
            's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/apt-mirrors.txt 2>/dev/null || true
          update_ok=""
          for attempt in 1 2 3; do
            if sudo apt-get update; then
              update_ok=1
              break
            fi
            echo "::warning::apt-get update failed (attempt ${attempt}/3); retrying"
            sleep "$((attempt * 10))"
          done
          if [ -z "${update_ok}" ]; then
            echo "::error::apt-get update failed three times; the Ubuntu mirror is unreachable"
            exit 1
          fi
          set -e
          sudo apt-get install -y --no-install-recommends \
            build-essential nasm pkg-config zlib1g-dev

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        shell: bash
        run: brew install nasm pkg-config

      - name: Install Windows UCRT build tools
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            diffutils
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-zlib
            tar

      - name: Build, probe, smoke-test, and package the runtime
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
          SOURCE_ARCHIVE: ${{ github.workspace }}/dist/ffmpeg-source/ffmpeg-8.1.2.tar.xz
          OUTPUT_DIR: ${{ github.workspace }}/dist/ffmpeg-runtime/${{ matrix.target }}
        run: bash scripts/build_managed_ffmpeg_runtime.sh

      - name: Build, probe, smoke-test, and package the Windows runtime
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
          SOURCE_ARCHIVE: ${{ github.workspace }}/dist/ffmpeg-source/ffmpeg-8.1.2.tar.xz
          OUTPUT_DIR: ${{ github.workspace }}/dist/ffmpeg-runtime/${{ matrix.target }}
        run: bash scripts/build_managed_ffmpeg_runtime.sh

      - name: Upload the one runtime archive and manifest pair
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffmpeg-runtime-${{ matrix.target }}
          path: |
            dist/ffmpeg-runtime/${{ matrix.target }}/*.zip
            dist/ffmpeg-runtime/${{ matrix.target }}/*.manifest-entry.json
          if-no-files-found: error
          retention-days: 30

  assemble:
    name: Assemble the exact Support release once
    needs: [authorize-runtime-dispatch, source, build]
    runs-on: ubuntu-22.04
    environment: native-release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the verified source and four build outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate the exact checksum asset and inventory
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -maxdepth 1 -type f \
            ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  release-assets/#  #' \
            > release-assets/SHA256SUMS
          mkdir contract
          python scripts/ffmpeg_support_release_contract.py inventory \
            --directory release-assets \
            --source-commit "${GITHUB_SHA}" \
            --output contract/support-artifact-inventory.json
          test "$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')" = 12

      - name: Attest the exact Support assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.0.0
        with:
          subject-path: release-assets/*

      - name: Upload the immutable 12-asset candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffmpeg-support-release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload the exact Support inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffmpeg-support-release-inventory
          path: contract/support-artifact-inventory.json
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Stage, bind, and publish the Support release
    needs: [authorize-runtime-dispatch, assemble]
    runs-on: ubuntu-22.04
    environment: release-identity
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download the exact candidate and inventory without rebuilding
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: ffmpeg-support-release-assets
          path: release-assets

      - name: Download the exact Support inventory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: ffmpeg-support-release-inventory
          path: contract

      - name: Mint one repository-scoped release App token
        id: release_app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.OPENADAPT_RELEASE_APP_ID }}
          private-key: ${{ secrets.OPENADAPT_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read
          permission-contents: write
          permission-metadata: read

      - name: Require the exact release App identity
        env:
          CONFIGURED_RELEASE_APP_ID: ${{ vars.OPENADAPT_RELEASE_APP_ID }}
          CONFIGURED_RELEASE_ACTOR_ID: ${{ vars.OPENADAPT_RELEASE_ACTOR_ID }}
          CONFIGURED_RELEASE_APP_INSTALLATION_ID: ${{ vars.OPENADAPT_RELEASE_APP_INSTALLATION_ID }}
          GH_TOKEN: ${{ steps.release_app.outputs.token }}
          RELEASE_APP_SLUG: ${{ steps.release_app.outputs.app-slug }}
          TOKEN_INSTALLATION_ID: ${{ steps.release_app.outputs['installation-id'] }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${RELEASE_APP_SLUG}" != openadapt-release ] || \
             [ "${CONFIGURED_RELEASE_APP_ID}" != "${RELEASE_APP_ID}" ] || \
             [ "${CONFIGURED_RELEASE_ACTOR_ID}" != "${RELEASE_APP_ACTOR_ID}" ] || \
             [ "${CONFIGURED_RELEASE_APP_INSTALLATION_ID}" != "${RELEASE_APP_INSTALLATION_ID}" ] || \
             [ "${TOKEN_INSTALLATION_ID}" != "${RELEASE_APP_INSTALLATION_ID}" ]; then
            echo "error: release token does not match the admitted App identity" >&2
            exit 1
          fi
          main_sha="$(
            gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha
          )"
          test "${main_sha}" = "${GITHUB_SHA}"
          gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/immutable-releases" \
            > contract/immutable-releases.json
          python scripts/production_release_contract.py validate-immutable-releases \
            --file contract/immutable-releases.json
          gh api --paginate --slurp -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/rulesets?includes_parents=false&per_page=100" \
            > contract/ruleset-pages.json
          creation_id="$(
            jq -er --arg name "${SUPPORT_TAG_CREATION_RULESET}" \
              '[.[][] | select(.name == $name)] |
               if length == 1 then .[0].id else error("creation ruleset count differs") end' \
              contract/ruleset-pages.json
          )"
          immutability_id="$(
            jq -er --arg name "${SUPPORT_TAG_IMMUTABILITY_RULESET}" \
              '[.[][] | select(.name == $name)] |
               if length == 1 then .[0].id else error("immutability ruleset count differs") end' \
              contract/ruleset-pages.json
          )"
          gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/rulesets/${creation_id}" \
            > contract/creation-ruleset.json
          gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/rulesets/${immutability_id}" \
            > contract/immutability-ruleset.json
          python scripts/ffmpeg_support_release_contract.py rulesets \
            --creation contract/creation-ruleset.json \
            --immutability contract/immutability-ruleset.json \
            --output contract/support-tag-rulesets.json
          tag="ffmpeg-runtime-v${FFMPEG_VERSION}-${RUNTIME_REVISION}"
          ref_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}"
          status="$(
            curl --silent --show-error --location \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              --output contract/tag-ref-before-draft.json \
              --write-out '%{http_code}' "${ref_url}"
          )"
          if [ "${status}" != 404 ] || \
             ! jq -e '.message == "Not Found"' contract/tag-ref-before-draft.json >/dev/null; then
            echo "error: managed FFmpeg Support tag exists or its absence was not proved" >&2
            exit 1
          fi
          gh api --paginate --slurp -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            > contract/release-pages.json
          jq -e --arg tag "${tag}" \
            '[.[][] | select(.tag_name == $tag)] | length == 0' \
            contract/release-pages.json >/dev/null

      - name: Create one App-authored draft before the tag exists
        env:
          GH_TOKEN: ${{ steps.release_app.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="ffmpeg-runtime-v${FFMPEG_VERSION}-${RUNTIME_REVISION}"
          gh api --method POST -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/releases" \
            -f "tag_name=${tag}" \
            -f "target_commitish=${GITHUB_SHA}" \
            -f "name=OpenAdapt managed FFmpeg ${FFMPEG_VERSION} ${RUNTIME_REVISION}" \
            -f "body=OpenAdapt Desktop downloads this separately licensed FFmpeg and ffprobe runtime when it needs local media processing. The files come from FFmpeg ${FFMPEG_VERSION}'s signed source. This build disables GPL, nonfree, and version3 features. OpenAdapt's wheel and installers don't contain these files." \
            -F draft=true \
            -F prerelease=false \
            -f make_latest=false \
            > contract/draft-created.json
          jq -e --arg tag "${tag}" --arg sha "${GITHUB_SHA}" \
            '.tag_name == $tag and .target_commitish == $sha and
             .draft == true and .prerelease == false and .immutable == false and
             (.id | type == "number") and
             .author.id == 321543906 and .author.login == "openadapt-release[bot]" and
             (.assets | length == 0)' \
            contract/draft-created.json >/dev/null

      - name: Upload each of the exact 12 assets once
        env:
          GH_TOKEN: ${{ steps.release_app.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_id="$(jq -er '.id' contract/draft-created.json)"
          while IFS=$'\t' read -r name media_type; do
            encoded_name="$(jq -rn --arg value "${name}" '$value | @uri')"
            curl --fail-with-body --show-error --silent \
              --request POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              -H "Content-Type: ${media_type}" \
              --data-binary "@release-assets/${name}" \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?name=${encoded_name}" \
              >/dev/null
          done < <(
            jq -r '.artifacts[] | [.name, .media_type] | @tsv' \
              contract/support-artifact-inventory.json
          )

      - name: Prove the second tag absence and bind the exact remote draft bytes
        env:
          GH_TOKEN: ${{ steps.release_app.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="ffmpeg-runtime-v${FFMPEG_VERSION}-${RUNTIME_REVISION}"
          release_id="$(jq -er '.id' contract/draft-created.json)"
          gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            > contract/draft-release.json
          mkdir remote-draft-assets
          while IFS= read -r name; do
            asset_id="$(
              jq -er --arg name "${name}" \
                '[.assets[] | select(.name == $name)] |
                 if length == 1 then .[0].id else error("draft asset count differs") end' \
                contract/draft-release.json
            )"
            curl --fail-with-body --show-error --silent --location \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/octet-stream" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
              --output "remote-draft-assets/${name}"
          done < <(jq -r '.artifacts[].name' contract/support-artifact-inventory.json)
          ref_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}"
          status="$(
            curl --silent --show-error --location \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              --output contract/tag-ref-after-draft.json \
              --write-out '%{http_code}' "${ref_url}"
          )"
          if [ "${status}" != 404 ] || \
             ! jq -e '.message == "Not Found"' contract/tag-ref-after-draft.json >/dev/null; then
            echo "error: managed FFmpeg Support tag appeared during draft staging" >&2
            exit 1
          fi
          jq -cn --arg ref "refs/tags/${tag}" \
            '{ref: $ref, exists: false}' > contract/tag-ref-state.json
          python scripts/ffmpeg_support_release_contract.py staging \
            --release contract/draft-release.json \
            --inventory contract/support-artifact-inventory.json \
            --asset-directory remote-draft-assets \
            --immutable-releases contract/immutable-releases.json \
            --rulesets contract/support-tag-rulesets.json \
            --tag-ref-state contract/tag-ref-state.json \
            --observed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --output contract/support-release-staging.json
          python scripts/ffmpeg_support_release_contract.py validate-bound-release \
            --file contract/draft-release.json \
            --inventory contract/support-artifact-inventory.json \
            --staging contract/support-release-staging.json \
            --asset-directory remote-draft-assets \
            --phase draft
          python scripts/ffmpeg_support_release_contract.py tag-binding \
            --inventory contract/support-artifact-inventory.json \
            --staging contract/support-release-staging.json \
            --output contract/support-tag-binding.json
          python scripts/ffmpeg_support_release_contract.py validate-tag-binding \
            --file contract/support-tag-binding.json \
            --inventory contract/support-artifact-inventory.json \
            --staging contract/support-release-staging.json

      - name: Revalidate the bound authority immediately before tag creation
        env:
          GH_TOKEN: ${{ steps.release_app.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_id="$(jq -er '.id' contract/draft-created.json)"
          main_sha="$(
            gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha
          )"
          test "${main_sha}" = "${GITHUB_SHA}"
          gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/immutable-releases" \
            > contract/fresh-immutable-releases.json
          cmp contract/immutable-releases.json contract/fresh-immutable-releases.json
          for role in creation immutability; do
            if [ "${role}" = creation ]; then
              ruleset_id="$(jq -er '.[] | select(.role == "creation_authority") | .ruleset_id' contract/support-tag-rulesets.json)"
              expected=contract/creation-ruleset.json
            else
              ruleset_id="$(jq -er '.[] | select(.role == "immutability") | .ruleset_id' contract/support-tag-rulesets.json)"
              expected=contract/immutability-ruleset.json
            fi
            gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${GITHUB_REPOSITORY}/rulesets/${ruleset_id}" \
              > "contract/fresh-${role}-ruleset.json"
            cmp "${expected}" "contract/fresh-${role}-ruleset.json"
          done
          tag="ffmpeg-runtime-v${FFMPEG_VERSION}-${RUNTIME_REVISION}"
          status="$(
            curl --silent --show-error --location \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              --output contract/tag-ref-pre-tag.json \
              --write-out '%{http_code}' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}"
          )"
          test "${status}" = 404
          gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            > contract/fresh-draft-release.json
          python scripts/ffmpeg_support_release_contract.py validate-bound-release \
            --file contract/fresh-draft-release.json \
            --inventory contract/support-artifact-inventory.json \
            --staging contract/support-release-staging.json \
            --asset-directory remote-draft-assets \
            --phase draft

      - name: Create and verify the canonical annotated Support tag
        id: support_tag
        env:
          GH_TOKEN: ${{ steps.release_app.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="ffmpeg-runtime-v${FFMPEG_VERSION}-${RUNTIME_REVISION}"
          gh api --method POST -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/git/tags" \
            -f "tag=${tag}" \
            -F message=@contract/support-tag-binding.json \
            -f "object=${GITHUB_SHA}" \
            -f type=commit \
            > contract/tag-object-created.json
          tag_object_sha="$(
            python scripts/ffmpeg_support_release_contract.py validate-tag-object \
              --file contract/tag-object-created.json \
              --binding contract/support-tag-binding.json \
              --source-commit "${GITHUB_SHA}"
          )"
          test "$(
            gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha
          )" = "${GITHUB_SHA}"
          status="$(
            curl --silent --show-error --location \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              --output contract/tag-ref-pre-create.json \
              --write-out '%{http_code}' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}"
          )"
          test "${status}" = 404
          gh api --method POST -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${tag}" \
            -f "sha=${tag_object_sha}" \
            > contract/tag-ref-created.json
          python scripts/ffmpeg_support_release_contract.py validate-tag-ref \
            --file contract/tag-ref-created.json \
            --tag-object-sha "${tag_object_sha}"
          gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}" \
            > contract/live-tag-object.json
          python scripts/ffmpeg_support_release_contract.py validate-tag-object \
            --file contract/live-tag-object.json \
            --binding contract/support-tag-binding.json \
            --source-commit "${GITHUB_SHA}" >/dev/null
          echo "tag_object_sha=${tag_object_sha}" >> "${GITHUB_OUTPUT}"

      - name: Revalidate the exact draft and tag immediately before publication
        env:
          GH_TOKEN: ${{ steps.release_app.outputs.token }}
          TAG_OBJECT_SHA: ${{ steps.support_tag.outputs.tag_object_sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag="ffmpeg-runtime-v${FFMPEG_VERSION}-${RUNTIME_REVISION}"
          release_id="$(jq -er '.id' contract/draft-created.json)"
          test "$(
            gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha
          )" = "${GITHUB_SHA}"
          gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/immutable-releases" \
            > contract/prepublish-immutable-releases.json
          cmp contract/immutable-releases.json contract/prepublish-immutable-releases.json
          creation_ruleset_id="$(jq -er \
            '.[] | select(.role == "creation_authority") | .ruleset_id' \
            contract/support-tag-rulesets.json)"
          immutability_ruleset_id="$(jq -er \
            '.[] | select(.role == "immutability") | .ruleset_id' \
            contract/support-tag-rulesets.json)"
          gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/rulesets/${creation_ruleset_id}" \
            > contract/prepublish-creation-ruleset.json
          gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/rulesets/${immutability_ruleset_id}" \
            > contract/prepublish-immutability-ruleset.json
          cmp contract/creation-ruleset.json contract/prepublish-creation-ruleset.json
          cmp contract/immutability-ruleset.json contract/prepublish-immutability-ruleset.json
          gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            > contract/prepublish-draft-release.json
          python scripts/ffmpeg_support_release_contract.py validate-bound-release \
            --file contract/prepublish-draft-release.json \
            --inventory contract/support-artifact-inventory.json \
            --staging contract/support-release-staging.json \
            --asset-directory remote-draft-assets \
            --phase draft
          gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" \
            > contract/prepublish-tag-ref.json
          python scripts/ffmpeg_support_release_contract.py validate-tag-ref \
            --file contract/prepublish-tag-ref.json \
            --tag-object-sha "${TAG_OBJECT_SHA}"
          gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/git/tags/${TAG_OBJECT_SHA}" \
            > contract/prepublish-tag-object.json
          python scripts/ffmpeg_support_release_contract.py validate-tag-object \
            --file contract/prepublish-tag-object.json \
            --binding contract/support-tag-binding.json \
            --source-commit "${GITHUB_SHA}" >/dev/null

      - name: Publish the same draft and verify its immutable remote bytes
        env:
          GH_TOKEN: ${{ steps.release_app.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_id="$(jq -er '.id' contract/draft-created.json)"
          gh api --method PATCH -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            -F draft=false \
            -F prerelease=false \
            -f make_latest=false \
            > contract/publish-response.json
          for attempt in $(seq 1 30); do
            gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              > contract/published-release.json
            if jq -e \
              '.draft == false and .prerelease == false and .immutable == true and
               (.assets | length == 12) and
               (.assets | all(.state == "uploaded" and (.digest | type == "string")))' \
              contract/published-release.json >/dev/null; then
              break
            fi
            if [ "${attempt}" = 30 ]; then
              echo "error: managed FFmpeg Support release did not become immutable" >&2
              exit 1
            fi
            sleep 2
          done
          mkdir remote-published-assets
          while IFS= read -r name; do
            asset_id="$(
              jq -er --arg name "${name}" \
                '[.assets[] | select(.name == $name)] |
                 if length == 1 then .[0].id else error("published asset count differs") end' \
                contract/published-release.json
            )"
            curl --fail-with-body --show-error --silent --location \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/octet-stream" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
              --output "remote-published-assets/${name}"
          done < <(jq -r '.artifacts[].name' contract/support-artifact-inventory.json)
          python scripts/ffmpeg_support_release_contract.py validate-bound-release \
            --file contract/published-release.json \
            --inventory contract/support-artifact-inventory.json \
            --staging contract/support-release-staging.json \
            --asset-directory remote-published-assets \
            --phase published
          cmp release-assets/SHA256SUMS remote-published-assets/SHA256SUMS
          (cd remote-published-assets && sha256sum --check SHA256SUMS)

      - name: Retain the exact Support authority evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffmpeg-support-release-authority
          path: contract/
          if-no-files-found: error
          retention-days: 90
