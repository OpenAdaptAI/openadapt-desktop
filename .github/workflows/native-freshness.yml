name: Native Installer Freshness

# A release candidate must carry its engine and native version state before a
# release App tag is created. This read-only workflow detects any drift. It has
# no branch, pull-request, tag, or release publication authority.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Current engine version to prepare installers for (X.Y.Z; a leading v is stripped)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-freshness-check
  cancel-in-progress: false

jobs:
  validate-native-version:
    name: Validate the reviewed native version state
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'release' &&
       startsWith(github.event.release.tag_name, 'v') &&
       !github.event.release.prerelease &&
       !github.event.release.draft)
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Resolve the published engine release
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
              echo "error: manual freshness validation requires protected main" >&2
              exit 1
            fi
            version="${INPUT_VERSION#v}"
          else
            if [ "${GITHUB_EVENT_NAME}" != "release" ] || \
               [ "${GITHUB_REF}" != "refs/tags/${RELEASE_TAG}" ]; then
              echo "error: automatic freshness validation requires the exact release tag" >&2
              exit 1
            fi
            version="${RELEASE_TAG#v}"
          fi
          if ! printf '%s' "${version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "error: refusing non X.Y.Z version: ${version}" >&2
            exit 1
          fi

          engine_tag="v${version}"
          engine_commit="$(git rev-parse --verify "refs/tags/${engine_tag}^{commit}")" || {
            echo "error: matching engine tag ${engine_tag} does not exist" >&2
            exit 1
          }
          if ! git merge-base --is-ancestor "${engine_commit}" origin/main; then
            echo "error: ${engine_tag} is not an ancestor of current main" >&2
            exit 1
          fi
          gh release view "${engine_tag}" \
            --json databaseId,isDraft,isPrerelease,publishedAt,tagName,url \
            > engine-release.json
          python scripts/native_release.py validate-engine-release \
            --file engine-release.json \
            --repository "${GITHUB_REPOSITORY}" \
            --engine-tag "${engine_tag}" \
            --engine-commit "${engine_commit}"
          native_version="$(python scripts/native_release.py version)"
          if [ "${native_version}" != "${version}" ]; then
            echo "error: protected main native version ${native_version} differs from ${engine_tag}" >&2
            exit 1
          fi
          python scripts/check_release_consistency.py
          engine_version="$(python - <<'PY'
          from scripts.check_release_consistency import release_versions
          values = set(release_versions().values())
          if len(values) != 1:
              raise SystemExit("release versions are not synchronized")
          print(values.pop())
          PY
          )"
          if [ "${engine_version}" != "${version}" ]; then
            echo "error: protected main engine version ${engine_version} differs from ${engine_tag}" >&2
            exit 1
          fi
          if [ "${engine_commit}" != "$(git rev-parse origin/main)" ]; then
            echo "error: engine tag is not the exact reviewed main candidate" >&2
            exit 1
          fi
          escaped_version="${version//./\\.}"
          if ! grep -Eq "^## v${escaped_version} \\([0-9]{4}-[0-9]{2}-[0-9]{2}\\)$" CHANGELOG.md; then
            echo "error: reviewed candidate has no dated changelog entry" >&2
            exit 1
          fi
